# Public projects saboteur is validated against, pinned by commit.
# Run one with: script/integration-target NAME [WORKDIR] [--reeval S] [--check]
# expect: mutants per status at the pinned commit, per re-evaluation strategy.
# expect_on: per-platform overrides (linux, macos) for targets whose own tests
# depend on the machine; only the counts that differ are listed.
# allow_error_fraction: per-strategy upper bound on errored mutants, as a
# fraction of executed mutants, for a target whose own tests error on most
# mutants by design; the majority-error exit is accepted while the report
# stays within the bound.
# Update the snapshot deliberately when an operator change moves the counts.
dry-inflector:
  repo: https://github.com/dry-rb/dry-inflector.git
  commit: b6a2819f0cf1bc0c24e024bbdf73f4f67003cbc9
  license: MIT
  config: integration/configs/dry_inflector.rb
  schedule: pr
  expect:
    # class_eval: re-measured after element_removal went default-on (#306):
    # +23 killed, +5 survived (was killed 578, survived 24). The 10 errors
    # are pre-existing class_eval strategy losses (NameError on the Rules
    # constant, pinned since before #294), unchanged by the new operator.
    # #583 (regex_replacement) added 9 killed + 5 survived mutants here (was killed 601, survived 29).
    # #653 (argument_swap) added 23 killed + 1 survived here: the survivor is
    # argument_swap on inflect.irregular("sex", "sexes") (defaults.rb:95,
    # 8dd60987d231253c) - the target's specs never assert that irregular pair.
    # jump_value added 2 killed here (was killed 633).
    # when_removal added 3 killed here (was killed 635): when branches in
    # lib/dry/inflector.rb, all killed; no new survivors.
    class_eval: { killed: 638, survived: 35, timeout: 0, error: 10, skipped: 0 }
    # nesting: re-measured after element_removal went default-on (#306):
    # +23 killed, +5 survived (was killed 587, survived 25). The survivors
    # are element_removal removals of uncountable/acronym entries the
    # target's specs never assert (Swiss, series, jeans, CSV, DB).
    # #653 (argument_swap) added 23 killed + 1 survived here: the survivor is
    # argument_swap on inflect.irregular("sex", "sexes") (defaults.rb:95,
    # 8dd60987d231253c) - the target's specs never assert that irregular pair.
    # jump_value added 2 killed here (was killed 642).
    # when_removal added 3 killed here (was killed 644).
    nesting: { killed: 647, survived: 36, timeout: 0, error: 0, skipped: 0 }
tty-color:
  repo: https://github.com/piotrmurach/tty-color.git
  commit: e2410967c13e0d3e2297456db22495cb246b22f5
  license: MIT
  config: integration/configs/tty_color.rb
  schedule: pr
  expect:
    # class_eval: killed + error is 151 after #478 stopped emitting
    # each<->map method_swap mutants in discarded-value positions (was
    # 153 after #237/#238's default-on operators). The killed/error split
    # can vary by run (Linux measured 81 killed, 72 errors), so only the
    # sum is checked.
    # jump_value added 5 killed + 1 skipped here (was 153 and skipped 1): the
    # skipped one is `return false if disabled?` in Support#support?
    # (support.rb:43), a branch the target's specs never take, the same line
    # literal_boolean already skips.
    # rescue_removal added 1 mutant here, support.rb:110 (the `rescue LoadError`
    # handler of from_curses), which errors under this strategy like its
    # neighbours (was killed+error 158).
    # when_removal added 11 mutants here (was killed+error 159), 9 in color/mode.rb and 2 in
    # color/support.rb, all killed or errored; survivors and skipped unchanged.
    class_eval: { killed+error: 170, survived: 13, timeout: 0, skipped: 2 }
    # macOS literal expansion has not been measured, and no CI job runs
    # integration targets on macOS. Keep the historical (pre-guard) baseline
    # here until a macOS run supplies a replacement snapshot; Linux CI reads
    # the override below.
    nesting: { killed: 118, survived: 16, timeout: 0, error: 0, skipped: 2 }
  # Mode#from_tput (is tput on PATH?) and Support#support? (is stdout a
  # terminal?) take different paths in tty-color's own tests on Linux CI.
  expect_on:
    linux:
      # Measured after #478 stopped emitting each<->map method_swap
      # mutants in discarded-value positions (survived was 22; both
      # suppressed mutants were survivors). Before that, #237/#238's
      # default-on operators (was killed 130, survived 20).
      # jump_value added 5 killed + 1 skipped (was killed 144, skipped 1);
      # see the class_eval note above for the skipped one.
      # rescue_removal added 1 killed (was 149): support.rb:110, the
      # `rescue LoadError` handler of from_curses; its removal crashes with a
      # LoadError the specs do not expect.
      # when_removal added 11 killed (was 150).
      nesting: { killed: 161, survived: 22, skipped: 2 }
  # class_eval: spec/unit/mode_spec.rb[1:3] kills most Mode mutants with a
  # test that also fails with the method unchanged ("uninitialized constant
  # TTY::Color::Mode::NoValue"), so over half the mutants error on every
  # run (57 of 139, ~41%) and the majority-error exit would fail the job.
  # Allow that exit while the errored fraction stays under 60%; the
  # snapshot above still pins survived, timeout, skipped and the
  # killed+error total.
  allow_error_fraction:
    class_eval: 0.6
human-essentials:
  repo: https://github.com/rubyforgood/human-essentials.git
  commit: d6f829046ee9696499f6781fc8f9e434d270a2be
  license: MIT
  config: integration/configs/human_essentials.rb
  schedule: nightly
  ruby: 3.4.3
  needs: Postgres (DATABASE_URL for the test database), RAILS_ENV=test
# doorkeeper and paper_trail run their model specs in process against sqlite.
# Each carries a patch (integration/patches) that skips SimpleCov under
# saboteur and, for doorkeeper, puts the test database in a file the mutant
# sandboxes share. script/integration-recorders runs them under both coverage
# recorders and fails on any per-mutant verdict difference (#725).
doorkeeper:
  repo: https://github.com/doorkeeper-gem/doorkeeper.git
  commit: c3df01d0651e06cf940865c5ba0752a6eb211cee
  license: MIT
  config: integration/configs/doorkeeper.rb
  schedule: nightly
  patch: integration/patches/doorkeeper.patch
  env:
    SAB_NO_SIMPLECOV: 1
    SAB_DB: /tmp/saboteur-doorkeeper/test.sqlite3
  # Three mixins, spec/models only, one job (shared sqlite file). No expect
  # counts until a CI run measures them.
paper_trail:
  repo: https://github.com/paper-trail-gem/paper_trail.git
  commit: 86ce1b83078ef8594cad8f62877ac37f3cb011cc
  license: MIT
  config: integration/configs/paper_trail.rb
  schedule: nightly
  gemfile: gemfiles/rails_7.2.gemfile
  patch: integration/patches/paper_trail.patch
  env:
    SAB_NO_SIMPLECOV: 1
  # No expect counts until a CI run measures them.
# cancancan: the whole suite (712 examples) is the parity scope. The patch drops
# pg from its Appraisal gemfile (no libpq needed; the specs run on sqlite).
cancancan:
  repo: https://github.com/CanCanCommunity/cancancan.git
  commit: 4362b39b04e6840c8edbd2cb4de16b2d77b19c3c
  license: MIT
  config: integration/configs/cancancan.rb
  schedule: nightly
  gemfile: gemfiles/activerecord_7.2.0.gemfile
  patch: integration/patches/cancancan.patch
  env:
    DB: sqlite
  # No expect counts until a CI run measures them.
