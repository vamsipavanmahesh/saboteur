# Public projects saboteur is validated against, pinned by commit.
# Run one with: script/integration-target NAME [WORKDIR] [--reeval S] [--check]
# expect: mutants per status at the pinned commit, per re-evaluation strategy.
# expect_on: per-platform overrides (linux, macos) for targets whose own tests
# depend on the machine; only the counts that differ are listed.
# allow_error_fraction: per-strategy upper bound on errored mutants, as a
# fraction of executed mutants, for a target whose own tests error on most
# mutants by design; the majority-error exit is accepted while the report
# stays within the bound.
# Update the snapshot deliberately when an operator change moves the counts.
dry-inflector:
  repo: https://github.com/dry-rb/dry-inflector.git
  commit: b6a2819f0cf1bc0c24e024bbdf73f4f67003cbc9
  license: MIT
  config: integration/configs/dry_inflector.rb
  schedule: pr
  expect:
    class_eval: { killed: 519, survived: 23, timeout: 0, error: 9, skipped: 0 }
    nesting: { killed: 527, survived: 24, timeout: 0, error: 0, skipped: 0 }
tty-color:
  repo: https://github.com/piotrmurach/tty-color.git
  commit: e2410967c13e0d3e2297456db22495cb246b22f5
  license: MIT
  config: integration/configs/tty_color.rb
  schedule: pr
  expect:
    # class_eval: killed + error is 151 after argument, pair and coarse-gate removal. Their split
    # can vary by run (historical baseline 59/68 to 69/58), so only the sum
    # is checked. The cause is still open.
    class_eval: { killed+error: 151, survived: 13, timeout: 0, skipped: 0 }
    # macOS literal expansion has not been measured. Keep the historical
    # baseline here until a macOS run supplies a replacement snapshot.
    nesting: { killed: 118, survived: 16, timeout: 0, error: 0, skipped: 2 }
  # Mode#from_tput (is tput on PATH?) and Support#support? (is stdout a
  # terminal?) take different paths in tty-color's own tests on Linux CI.
  expect_on:
    linux:
      nesting: { killed: 138, survived: 26, skipped: 0 }
  # class_eval: spec/unit/mode_spec.rb[1:3] kills most Mode mutants with a
  # test that also fails with the method unchanged ("uninitialized constant
  # TTY::Color::Mode::NoValue"), so over half the mutants error on every
  # run (76 of 147, ~52%) and the majority-error exit would fail the job.
  # Allow that exit while the errored fraction stays under 60%; the
  # snapshot above still pins survived, timeout, skipped and the
  # killed+error total.
  allow_error_fraction:
    class_eval: 0.6
human-essentials:
  repo: https://github.com/rubyforgood/human-essentials.git
  commit: d6f829046ee9696499f6781fc8f9e434d270a2be
  license: MIT
  config: integration/configs/human_essentials.rb
  schedule: nightly
  ruby: 3.4.3
  needs: Postgres (DATABASE_URL for the test database), RAILS_ENV=test
