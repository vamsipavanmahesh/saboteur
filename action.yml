name: saboteur mutation testing
description: >-
  Runs saboteur in diff mode against the pull request event's exact base
  commit. Advisory by default.
author: Vamsi Pavan Mahesh Gunturu
branding:
  icon: shield
  color: red

inputs:
  command:
    description: How to start saboteur. The project's Gemfile must include saboteur.
    required: false
    default: bundle exec saboteur
  arguments:
    description: >-
      Extra saboteur arguments, split on whitespace (shell quoting is not
      supported), for example "--jobs 2". --since and --json belong to the
      action and are rejected here.
    required: false
    default: ""
  fail-on-survivors:
    description: >-
      "true" or "false" (anything else fails the step). "true" fails the step
      when a mutant survives or the run is incomplete. The default, "false",
      only reports. A saboteur usage or tool error, or a missing or unreadable
      report, always fails the step.
    required: false
    default: "false"
  baseline:
    description: >-
      Path of an accepted survivor baseline file (see "Opt-in survivor
      baseline" in the README). When set, the action runs
      `saboteur baseline check` on the whole project instead of the diff-mode
      run, and the pull request diff, report and annotation outputs stay
      empty. The check fails on new, changed or unmatched survivors. Empty
      (the default) keeps the diff-mode run.
    required: false
    default: ""
  baseline-epsilon:
    description: >-
      Only with `baseline`. The largest score drop, in percentage points
      below the baseline's score, that still passes (0 to 100). A larger drop
      is reported as needing review, like a new survivor. Empty keeps only the
      survivor comparison.
    required: false
    default: ""
  max-timeouts:
    description: >-
      Fail the saboteur run when more than this many mutants end as a timeout:
      a count ("3") or a percentage of the executed mutants ("5%"). Passed as
      --max-timeouts. Empty means no gate. Like a survivor, a failed gate only
      fails the step with fail-on-survivors "true".
    required: false
    default: ""
  max-errors:
    description: >-
      Fail the saboteur run when more than this many mutants end as an error:
      a count ("3") or a percentage of the executed mutants ("5%"). Passed as
      --max-errors. Empty means no gate. With a value set, errored mutants
      within the limit no longer fail an incomplete run under
      fail-on-survivors "true".
    required: false
    default: ""
  max-duration:
    description: >-
      Wall-time budget for the whole run, passed as --max-duration (for
      example "10m"). When the budget runs out, saboteur stops early with
      exit 4 and the step fails; the summary says so. Empty means no budget:
      a big diff then runs until the GitHub job timeout kills it with no
      summary at all, so set one (#1210).
    required: false
    default: ""
  cache:
    description: >-
      "true" or "false" (anything else fails the step). "false" skips restoring
      the cached coverage map and passes --no-cache to saboteur, so the map is
      rebuilt.
    required: false
    default: "true"
  report-path:
    description: Where saboteur writes its JSON report.
    required: false
    default: .saboteur/report.json
  artifact-name:
    description: >-
      Name of the uploaded JSON report artifact. Defaults to
      saboteur-report-<job>-<matrix leg>. Set it when a job uses this action
      more than once: upload-artifact rejects a second upload under one name.
    required: false
    default: ""
  review-comments:
    description: >-
      "true" posts surviving mutants as review comments on the pull request's
      changed lines, at most max-comments of them, and removes a comment once
      its mutant is killed. The default, "false", posts nothing. Needs
      `pull-requests: write` for the job; a fork's pull request is skipped.
      A failure to comment never fails the step.
    required: false
    default: "false"
  max-comments:
    description: >-
      The most review comments to keep on the pull request. More survivors are
      counted in one summary comment that links the run.
    required: false
    default: "10"
  github-token:
    description: >-
      Token the review comments are posted with, and the base commit is fetched
      with when the checkout did not keep credentials (needs contents: read).
    required: false
    default: ${{ github.token }}
  bot-login:
    description: >-
      Login of the account github-token posts as. Only its comments are kept,
      deduplicated and removed. Set it when github-token is a personal access
      token or an app token, or the comment cap is posted again on every push.
    required: false
    default: github-actions[bot]

outputs:
  ran:
    description: '"true" when saboteur ran, "false" when the action had nothing to do or stopped early.'
    value: ${{ steps.run.outputs.ran }}
  exit-code:
    description: >-
      saboteur's exit code: 0 clean, 1 survivors, 2 usage error, 3 the change
      could not be verified, 4 time budget spent, 5 baseline suite red (fix your
      tests first), 70 internal crash (a saboteur bug, never your code).
    value: ${{ steps.run.outputs.exit-code }}
  score:
    description: >-
      Covered score as a percentage: (killed + timeout) / (killed + timeout +
      survived). "n/a" when no mutant was scored.
    value: ${{ steps.run.outputs.score }}
  killed:
    description: Number of killed mutants.
    value: ${{ steps.run.outputs.killed }}
  survivors:
    description: Number of survived mutants not accepted by the ignore list.
    value: ${{ steps.run.outputs.survivors }}
  accepted-survivors:
    description: Number of survived mutants accepted by config/saboteur_ignore.rb.
    value: ${{ steps.run.outputs.accepted-survivors }}
  timeouts:
    description: Number of mutants that timed out (counted as kills in the score).
    value: ${{ steps.run.outputs.timeouts }}
  errors:
    description: Number of mutants that errored or hit a resource limit. They are not scored.
    value: ${{ steps.run.outputs.errors }}
  incomplete:
    description: '"true" when some mutants errored or hit a resource limit.'
    value: ${{ steps.run.outputs.incomplete }}
  report-valid:
    description: '"true" when this run wrote a report the action could read.'
    value: ${{ steps.run.outputs.report-valid }}
  report-path:
    description: Path of the JSON report.
    value: ${{ steps.run.outputs.report-path }}
  baseline-state:
    description: >-
      Only with `baseline`: the check state (clean, review_required,
      incompatible or incomplete).
    value: ${{ steps.baseline.outputs.baseline-state }}
  baseline-score-drop:
    description: >-
      Only with `baseline` and `baseline-epsilon`: baseline score minus the
      fresh score, in percentage points. Negative when the score rose.
    value: ${{ steps.baseline.outputs.baseline-score-drop }}

runs:
  using: composite
  steps:
    - name: Check the survivor baseline
      if: inputs.baseline != ''
      id: baseline
      shell: bash
      env:
        SABOTEUR_EVENT_NAME: ${{ github.event_name }}
        SABOTEUR_COMMAND: ${{ inputs.command }}
        SABOTEUR_ARGUMENTS: ${{ inputs.arguments }}
        SABOTEUR_BASELINE: ${{ inputs.baseline }}
        SABOTEUR_BASELINE_EPSILON: ${{ inputs.baseline-epsilon }}
        SABOTEUR_FAIL_ON_SURVIVORS: ${{ inputs.fail-on-survivors }}
      run: bash "${{ github.action_path }}/action/run-baseline-gate"
    - name: Restore the coverage map
      if: inputs.baseline == '' && inputs.cache == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        # The inputs snapshot rides with the map: a later run reads it to
        # tell which files changed, and without it the map is never reused.
        # The pointer names the freshest whole-suite map: without it a pull
        # request never confirms survivors against it (#1317).
        path: |
          .saboteur/coverage-*.json
          .saboteur/inputs-*.json
          .saboteur/whole-suite-map-v2
        key: saboteur-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'config/saboteur.rb', 'config/saboteur_custom_map.rb', 'config/saboteur_ignore.rb') }}-${{ github.sha }}
        restore-keys: |
          saboteur-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'config/saboteur.rb', 'config/saboteur_custom_map.rb', 'config/saboteur_ignore.rb') }}-
    # The token is for this step alone: it exits before any test of the pull
    # request runs, so a checkout with persist-credentials: false still gets
    # its base commit, and the token is never in the environment of the tests.
    - name: Fetch the pull request base
      if: inputs.baseline == '' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      continue-on-error: true
      shell: bash
      env:
        SABOTEUR_FETCH_TOKEN: ${{ inputs.github-token }}
        SABOTEUR_EVENT_NAME: ${{ github.event_name }}
        SABOTEUR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha }}
      run: bash "${{ github.action_path }}/action/fetch-base"
    - name: Mutate the changed methods
      if: inputs.baseline == ''
      id: run
      shell: bash
      env:
        SABOTEUR_EVENT_NAME: ${{ github.event_name }}
        SABOTEUR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha }}
        SABOTEUR_EXPECTED_HEAD_SHA: ${{ github.sha }}
        SABOTEUR_COMMAND: ${{ inputs.command }}
        SABOTEUR_ARGUMENTS: ${{ inputs.arguments }}
        SABOTEUR_FAIL_ON_SURVIVORS: ${{ inputs.fail-on-survivors }}
        SABOTEUR_MAX_TIMEOUTS: ${{ inputs.max-timeouts }}
        SABOTEUR_MAX_ERRORS: ${{ inputs.max-errors }}
        SABOTEUR_MAX_DURATION: ${{ inputs.max-duration }}
        SABOTEUR_REPORT_PATH: ${{ inputs.report-path }}
        SABOTEUR_CACHE: ${{ inputs.cache }}
        SABOTEUR_ARTIFACT_NAME: ${{ inputs.artifact-name || format('saboteur-report-{0}-{1}', github.job, strategy.job-index) }}
      run: bash "${{ github.action_path }}/action/run-saboteur"
    # A run that fails on survivors still built a valid map, and a plain
    # cache step would skip its post-save then (save-always on actions/cache
    # is deprecated), so the save is its own step that runs always.
    - name: Save the coverage map
      if: always() && inputs.baseline == '' && inputs.cache == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .saboteur/coverage-*.json
          .saboteur/inputs-*.json
          .saboteur/whole-suite-map-v2
        key: saboteur-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'config/saboteur.rb', 'config/saboteur_custom_map.rb', 'config/saboteur_ignore.rb') }}-${{ github.sha }}
    # Only a report this run produced and could trust is kept: an early
    # failure (bad inputs, missing base SHA, no jq) leaves report-valid unset,
    # so a stale file restored from a cache is never published. A survivor or
    # incomplete failure still uploads, because the summary promises it.
    - name: Keep the JSON report
      if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.run.outputs.report-valid == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name || format('saboteur-report-{0}-{1}', github.job, strategy.job-index) }}
        path: ${{ inputs.report-path }}
        if-no-files-found: ignore
    - name: Comment surviving mutants on the pull request
      if: always() && inputs.review-comments == 'true' && github.event_name == 'pull_request' && steps.run.outputs.report-valid == 'true'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SABOTEUR_EVENT_NAME: ${{ github.event_name }}
        SABOTEUR_REPORT_PATH: ${{ inputs.report-path }}
        SABOTEUR_PR_NUMBER: ${{ github.event.pull_request.number }}
        SABOTEUR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SABOTEUR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        SABOTEUR_MAX_COMMENTS: ${{ inputs.max-comments }}
        SABOTEUR_BOT_LOGIN: ${{ inputs.bot-login }}
        SABOTEUR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: ruby "${{ github.action_path }}/action/post-review-comments"
