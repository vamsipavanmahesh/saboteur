AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    # Target code for end-to-end runs; written to exercise saboteur, not to lint clean.
    - "spec/fixtures/projects/**/*"
    # The project's own config files; data DSL loaded at runtime, not linted as source.
    - "config/saboteur.rb"
    - "config/saboteur_ignore.rb"
    - "config/saboteur_custom_map.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# saboteur walks ASTs and supervises processes; short-method limits would
# split linear logic into fragments. Keep limits, at sizes that fit that work.
Metrics/AbcSize:
  Max: 30
Metrics/MethodLength:
  Max: 25
# The explain command's dispatch entry takes CLI#call to 13.
Metrics/CyclomaticComplexity:
  Max: 13
Metrics/PerceivedComplexity:
  Max: 12
# The stacked custom-map work (#600, #642, #640) fits at 310.
Metrics/ClassLength:
  # SubjectSelection carries the attribute-miss messaging (#373); the
  # map-entry fall-through (#640) stacks on #373 and #692 at 330; the
  # by-reference fallback (#725) takes it to 350. The terminal's score
  # honesty closing block (headline, untested section, canonical line,
  # verdict line) takes it to 370; the #1087 skip-wording helpers it
  # absorbs on rebase take it to 380, and the headline context (threshold
  # echo, previous-score delta) takes it to 390; the colour contract's
  # middot glyph helper takes it to 393 (#1126 and #1127 fit within it);
  # the PR6 clean-run screen and baseline-tail guard take it to 428; the
  # clean screen's phase lines (baseline, coverage, dots) take it to 442.
  Max: 442
Metrics/ModuleLength:
  # RunReporting's replay command narrows to the mutant's covering specs
  # (#1148), one line over the default; text_run's whole-suite
  # covering-map plumbing and its cache-off gate (review C1) take
  # RunReporting to 106.
  Max: 106
  # OperatorExplain carries the curated survives/kill guidance for all 37
  # registry operators; those content lines are intrinsic to the feature.
  Exclude:
    - lib/saboteur/mutation_source/operator_explain.rb

Metrics/ParameterLists:
  CountKeywordArgs: false

Layout/LineLength:
  Max: 120
