AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    # Target code for end-to-end runs; written to exercise saboteur, not to lint clean.
    - "spec/fixtures/projects/**/*"
    # The project's own config files; data DSL loaded at runtime, not linted as source.
    - "config/saboteur.rb"
    - "config/saboteur_ignore.rb"
    - "config/saboteur_custom_map.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# saboteur walks ASTs and supervises processes; short-method limits would
# split linear logic into fragments. Keep limits, at sizes that fit that work.
Metrics/AbcSize:
  Max: 30
Metrics/MethodLength:
  Max: 25
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/PerceivedComplexity:
  Max: 12
Metrics/ClassLength:
  # SubjectSelection carries the attribute-miss messaging (#373).
  Max: 320
Metrics/ParameterLists:
  CountKeywordArgs: false

Layout/LineLength:
  Max: 120
