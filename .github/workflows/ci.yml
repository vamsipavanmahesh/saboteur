name: CI

on:
  push:
    branches: [main]
    # Docs-only merges skip the matrix: the panel gate never waits on main
    # push runs (it checks the pull request head's own run), so spawning a
    # full macOS matrix for a docs page only starves the self-hosted pool.
    paths-ignore:
      - 'README*'
      - 'CHANGELOG*'
      - '*.md'
      - 'docs/**'
      - 'assets/**'
  # PR CI is manual: the matrix does not run on pull_request events (the DCO
  # workflow in dco.yml still does). A maintainer runs it against the exact
  # PR head with
  #   gh workflow run ci.yml --ref <head-branch> -f pr_number=<n> -f base_sha=<base-sha>
  # --ref must be a branch or tag name (the dispatch API rejects a raw SHA),
  # so exact-head binding comes from the API proof inside the run, not from
  # the ref: the macOS and dogfood jobs prove from the pull request that its
  # head is the checked-out SHA and its base is the base_sha input, and fail
  # closed otherwise. For a fork pull request the maintainer first pushes the
  # reviewed head into this repository, then dispatches on that branch:
  #   git push origin <reviewed-head-sha>:refs/heads/ci-pr-<n>
  #   gh workflow run ci.yml --ref ci-pr-<n> -f pr_number=<n> -f base_sha=<base-sha>
  # The proof still binds headRefOid to the fork's commit, so the branch can
  # only ever name the reviewed change. head_repo (the PR's
  # head.repository.full_name) only skips the macOS legs early - the legs
  # prove the head repo from the API themselves.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number this run covers
        required: true
        type: string
      head_repo:
        description: The PR head's owner/repo, for the macOS fork guard
        required: false
        type: string
      base_sha:
        description: The PR's exact base commit (dogfood diff mode needs it)
        required: true
        type: string

permissions:
  contents: read

# A newer dispatch for a pull request cancels that PR's superseded run, and a
# new push to main cancels the previous main run. PRs stay grouped per pull
# request (dispatches carry no pull_request payload, so the input names it).
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr_number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # Job names use stable OS labels, not runner labels, so swapping runners
    # never renames a check the panel gate waits on (see #347).
    name: Ruby ${{ matrix.ruby }} / linux / shard ${{ matrix.shard }}
    # 1 vCPU is enough: one rspec process is single-threaded.
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 15
    # Job level, not strategy level (#402 put it under strategy:, which is
    # invalid there): a red 4.0 leg cannot fail the run's conclusion while
    # the line proves itself; the gate's advisoryJobs does the verdict side.
    continue-on-error: ${{ matrix.ruby == '4.0' }}
    strategy:
      fail-fast: false
      matrix:
        # "4.0" pins the proving 4.0 line (today 4.0.7) so coverage does not
        # end when "ruby" floats to 4.1; the panel gate treats these legs as
        # advisory (policy.json advisoryJobs), so they never block a merge.
        ruby: ["3.3", "3.4", "4.0", "ruby"] # "ruby" = latest stable
        # The full suite runs as 4 round-robin file shards per Ruby leg so
        # each parallel job stays short instead of one long leg per version.
        # The shard total lives in the matrix so the script argument cannot
        # drift from the shard list.
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # The extra json formatter only records per-example run times for the
      # shard weights (script/rspec-shard); the progress output and the
      # pass/fail verdict are unchanged. One Ruby per OS keeps the artifact
      # count down.
      - run: script/rspec-shard ${{ matrix.shard }} ${{ matrix.total }} --format progress --format json --out "$RUNNER_TEMP/rspec-times.json"
      - name: Keep the per-example run times
        if: always() && matrix.ruby == 'ruby'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rspec-times-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/rspec-times.json
          if-no-files-found: ignore

  # macOS legs run on GitHub-hosted macos-latest (arm64, free for public
  # repositories). The legs still run only for main pushes and for
  # dispatches whose head_repo input names this repository,
  # and the first step proves that input from the API - the pull request's
  # head repository must be this one and the dispatched SHA must be its
  # current head - so a wrong or forged head_repo fails closed before any
  # code is checked out. A fork pull request gets no macOS legs (the Linux
  # legs still cover it). Pull requests run the smallest useful matrix -
  # the latest stable Ruby only - while pushes to main still cover every
  # supported Ruby.
  test-macos:
    name: Ruby ${{ matrix.ruby }} / macos / shard ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The fork guard reads the pull request's head repo and head SHA.
      pull-requests: read
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.head_repo == github.repository)
    strategy:
      fail-fast: false
      # (No spaces after the JSON colons: a colon+space would break the YAML
      # plain scalar. The matrix itself is normal JSON.)
      matrix: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"ruby":["ruby"],"shard":[1,2,3,4,5],"total":[5]}') || fromJSON('{"ruby":["3.3","3.4","ruby"],"shard":[1,2,3],"total":[3]}') }}
    steps:
      # The head_repo input is only a skip-early hint. Before anything is
      # checked out, prove from the API that this dispatch covers one of
      # this repository's own pull requests and that the dispatched SHA is
      # that pull request's current head; anything else fails closed.
      # GraphQL answers with one compact object, so exact greps are safe.
      - name: Fail closed unless the dispatch is the pull request's own head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
        # Inline on purpose: this proof must pass before any checkout, and the
        # repo it would come from is what is being proven. It is the
        # REQUIRE_OWN_REPO=1 mode of script/ci-prove-pr-binding - keep in sync.
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in *[!0-9]*|'') echo "pr_number must be digits"; exit 1;; esac
          owner="${GITHUB_REPOSITORY%/*}"; name="${GITHUB_REPOSITORY#*/}"
          # Concatenation, not a printf format: printf eats the \" escapes (#551).
          payload='{"query":"{repository(owner:\"'"$owner"'\",name:\"'"$name"'\"){pullRequest(number:'"$PR_NUMBER"'){headRepository{nameWithOwner} headRefOid baseRefOid}}}"}'
          resp=$(curl -sfS -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d "$payload" https://api.github.com/graphql)
          echo "$resp" | grep -Fq "\"nameWithOwner\":\"$GITHUB_REPOSITORY\"" || { echo "PR #$PR_NUMBER is a fork or unknown head repo: no macOS legs"; exit 1; }
          echo "$resp" | grep -Fq "\"headRefOid\":\"$GITHUB_SHA\"" || { echo "dispatched SHA $GITHUB_SHA is not the current head of PR #$PR_NUMBER"; exit 1; }
          echo "$resp" | grep -Fq "\"baseRefOid\":\"$BASE_SHA\"" || { echo "base_sha $BASE_SHA is not the base of PR #$PR_NUMBER"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: script/rspec-shard ${{ matrix.shard }} ${{ matrix.total }} --format progress --format json --out "$RUNNER_TEMP/rspec-times.json"
      - name: Keep the per-example run times
        if: always() && matrix.ruby == 'ruby'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rspec-times-macos-${{ matrix.shard }}
          path: ${{ runner.temp }}/rspec-times.json
          if-no-files-found: ignore
      - name: Clean up after a non-ephemeral runner
        if: always()
        run: |
          # The saboteur-mac runners are long-lived, so state this job wrote
          # inside the checkout would survive into the next unrelated job.
          # Remove it. The shared bundler cache, the toolcache and stray
          # processes stay untouched on purpose: the cache is a speed
          # trade-off for a separate decision, and a process pattern cannot
          # tell this runner instance's children from the sibling
          # instances' on the same machine.
          git clean -ffdx

  # Non-UTF-8 locale regression net: the whole suite under LANG=C, where
  # external bytes arrive US-ASCII-tagged and any unforced boundary raises.
  locale:
    name: Ruby 3.4 / LANG=C / shard ${{ matrix.shard }}
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 15
    env:
      LANG: C
      LC_ALL: C
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: script/rspec-shard ${{ matrix.shard }} ${{ matrix.total }}

  lint:
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop
      - name: SPDX headers
        run: |
          # Fixture projects model a host repo, so like rubocop they are exempt
          # from the SPDX header rule that the real sources follow.
          missing=$(grep -L "SPDX-License-Identifier: MIT" $(git ls-files -- '*.rb' '*.gemspec' 'exe/*' Gemfile Rakefile ':(exclude)spec/fixtures/projects/**' ':(exclude)acceptance/fixtures/**') || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi

  integration-gems:
    name: ${{ matrix.target }} (${{ matrix.reeval }})
    # Namespace trial: slowest Linux job, moved to an nscloud AMD64 runner.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [dry-inflector, tty-color]
        reeval: [class_eval, nesting]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
      - name: Run against the pinned commit and compare counts
        # --jobs 4 uses all 4 vCPUs of the runner; everything after `--`
        # is forwarded to saboteur by script/integration-target.
        run: script/integration-target "${{ matrix.target }}" "$RUNNER_TEMP/targets" --reeval "${{ matrix.reeval }}" --check -- --jobs 4

  # saboteur on its own changed methods. Survivors fail the check unless they
  # are on config/saboteur_ignore.rb with a reason.
  dogfood:
    # Mutates the methods a pull request changed, so it runs on the manual
    # dispatch (the pull_request trigger is gone) but not on main pushes.
    if: github.event_name == 'workflow_dispatch'
    # The long pole of a pull request run at ~6 minutes: 4x8 halves it, and
    # --jobs 4 and --coverage-parts 4 match the 4 vCPUs (#741).
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 30
    permissions:
      contents: read
      # The binding proof reads the pull request's head, base and head repo.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Bind the dispatch to the pull request it names before mutating: the
      # checked-out SHA must be the pull request's current head and the
      # base_sha input its current base, proven from the API - the inputs are
      # never trusted. Fork pull requests are covered too (hosted runners
      # only), so unlike the macOS legs this does not demand an own-repo head.
      - name: Fail closed unless the dispatch is the pull request's head and base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUIRE_OWN_REPO: "0"
        run: script/ci-prove-pr-binding
      # A config-only diff has nothing in the include scope to mutate: say so and
      # no-op green instead of dying on the out-of-scope stop (#483, exit 2). The
      # pathspec mirrors c.include in config/saboteur.rb - keep them in sync.
      # A version-only diff (a release pull request: version.rb plus docs like
      # CHANGELOG.md) hits the same stop, because config/saboteur.rb excludes
      # lib/saboteur/version.rb from mutation; no-op green for it too (#1084).
      # Runs after the binding step, so inputs.base_sha is already proven.
      - name: Detect config-only and version-only pull requests
        id: scope
        run: |
          if git diff --quiet "${{ inputs.base_sha }}" HEAD -- "lib/*.rb"; then
            echo "::notice::dogfood: no changed file lies inside the include scope (config-only diff); nothing to mutate, no-op green"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$(git diff --name-only "${{ inputs.base_sha }}" HEAD -- "lib/*.rb" | grep -vx 'lib/saboteur/version.rb')" ]; then
            echo "::notice::dogfood: only lib/saboteur/version.rb changed and config/saboteur.rb excludes it from mutation; nothing to mutate, no-op green"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mutate methods changed in this pull request
        if: steps.scope.outputs.empty != 'true'
        uses: ./
        with:
          command: bundle exec exe/saboteur
          arguments: --baseline-passes 1 --jobs 4 --coverage-parts 4
          fail-on-survivors: "true"
      - name: Keep the report
        if: always() && steps.scope.outputs.empty != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saboteur-report
          # The per-part coverage build and baseline logs carry the failing
          # example when the suite breaks before any mutant runs (#801).
          path: |
            .saboteur/report.json
            .saboteur/*.log
          # upload-artifact skips hidden paths by default, and .saboteur is one.
          include-hidden-files: true

  # Warms the coverage map for pull request dispatches. GitHub only lets a
  # run restore caches saved on its own ref or on the default branch, so a
  # map saved by a dispatch on a feature branch never reaches the next one.
  # This job saves it on main; a dispatch's restore-keys then finds it and
  # the map build can reuse part of it. The Gemfile.lock and config hashes
  # match the action's key, so the two share entries. Free: it uses the same
  # runner pool as the dogfood job, once per main push.
  warm-map:
    if: github.event_name == 'push'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .saboteur/coverage-*.json
            .saboteur/inputs-*.json
            .saboteur/whole-suite-map-v2
          key: saboteur-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'config/saboteur.rb', 'config/saboteur_custom_map.rb', 'config/saboteur_ignore.rb') }}-${{ github.sha }}
          restore-keys: |
            saboteur-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'config/saboteur.rb', 'config/saboteur_custom_map.rb', 'config/saboteur_ignore.rb') }}-
      # Mutates the methods the last commit changed; the point is the map
      # this run leaves in .saboteur. Survivors do not fail the warm-up.
      - name: Build the coverage map
        run: bundle exec exe/saboteur run --since HEAD~1 --baseline-passes 1 --jobs 4 --coverage-parts 4 || true

  # Ignore-hygiene audit (#703): a digest a pull request adds to
  # config/saboteur_ignore.rb must arise live on its head; a dropped
  # digest must be dead or killed by the suite. The de-ignore incident on
  # #571 slipped past scoped dogfood because the subject had not changed.
  ignore-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 25
    permissions:
      contents: read
      # The binding proof reads the pull request's head, base and head repo.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fail closed unless the dispatch is the pull request's head and base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUIRE_OWN_REPO: "0"
        run: script/ci-prove-pr-binding
      - name: Audit ignore-file digest churn
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        # Run the BASE ref's audit code against the head checkout: a pull
        # request must not edit the audit that judges it. A base predating
        # the script (it lands with this change) fails closed here.
        run: |
          git worktree add --detach "$RUNNER_TEMP/ignore-audit-base" "$BASE_SHA"
          bundle exec ruby "$RUNNER_TEMP/ignore-audit-base/script/ignore-audit" "$BASE_SHA"
