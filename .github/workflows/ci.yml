name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    # macOS cells run on the maintainer's self-hosted Mac for pushes and same-repo PRs;
    # fork PRs are routed to GitHub-hosted macOS by this expression. This is routing, not
    # a security boundary: a fork PR runs its own copy of this file. The boundary is the
    # repo's "require approval for all external contributors" setting plus a standing rule:
    # a fork run is approved only after checking that the exact-SHA workflow graph (all
    # workflow files, new or changed, including reusable workflow refs) cannot request
    # self-hosted labels.
    runs-on: ${{ (matrix.os == 'macos-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","macOS","ARM64"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.3", "3.4", "ruby"] # "ruby" = latest stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop
      - name: SPDX headers
        run: |
          missing=$(grep -L "SPDX-License-Identifier: MIT" $(git ls-files '*.rb' '*.gemspec' 'exe/*' Gemfile Rakefile) || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi

  integration-gems:
    name: ${{ matrix.target }} (${{ matrix.reeval }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dry-inflector, tty-color]
        reeval: [class_eval, nesting]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
      - name: Run against the pinned commit and compare counts
        run: script/integration-target "${{ matrix.target }}" "$RUNNER_TEMP/targets" --reeval "${{ matrix.reeval }}" --check

  # saboteur on its own changed methods. Survivors fail the check unless they
  # are on .saboteur-ignore.yml with a reason.
  dogfood:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Mutate methods changed in this pull request
        uses: ./
        with:
          command: bundle exec exe/saboteur
          fail-on-survivors: "true"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saboteur-report
          path: .saboteur/report.json
