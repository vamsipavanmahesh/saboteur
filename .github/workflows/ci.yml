name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Newer pushes to a pull request cancel that PR's superseded runs. Runs on main
# are keyed by commit, so a push to main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Namespace trial: macOS legs run on nscloud (Apple Silicon, 6 vCPU / 14 GB).
        # Revert to macos-latest to fall back to GitHub-hosted runners.
        os: [nscloud-ubuntu-24.04-amd64-4x8, nscloud-macos-sequoia-arm64-6x14]
        ruby: ["3.3", "3.4", "ruby"] # "ruby" = latest stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  # Non-UTF-8 locale regression net: the whole suite under LANG=C, where
  # external bytes arrive US-ASCII-tagged and any unforced boundary raises.
  locale:
    name: Ruby 3.4 / LANG=C
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    env:
      LANG: C
      LC_ALL: C
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop
      - name: SPDX headers
        run: |
          # Fixture projects model a host repo, so like rubocop they are exempt
          # from the SPDX header rule that the real sources follow.
          missing=$(grep -L "SPDX-License-Identifier: MIT" $(git ls-files -- '*.rb' '*.gemspec' 'exe/*' Gemfile Rakefile ':(exclude)spec/fixtures/projects/**') || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi

  integration-gems:
    name: ${{ matrix.target }} (${{ matrix.reeval }})
    # Namespace trial: slowest Linux job, moved to an nscloud AMD64 runner.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    strategy:
      fail-fast: false
      matrix:
        target: [dry-inflector, tty-color]
        reeval: [class_eval, nesting]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
      - name: Run against the pinned commit and compare counts
        run: script/integration-target "${{ matrix.target }}" "$RUNNER_TEMP/targets" --reeval "${{ matrix.reeval }}" --check

  # saboteur on its own changed methods. Survivors fail the check unless they
  # are on config/saboteur_ignore.rb with a reason.
  dogfood:
    if: github.event_name == 'pull_request'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Mutate methods changed in this pull request
        uses: ./
        with:
          command: bundle exec exe/saboteur
          fail-on-survivors: "true"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saboteur-report
          path: .saboteur/report.json
