name: CI

on:
  push:
    branches: [main]
    # Docs-only merges skip the matrix: the panel gate never waits on main
    # push runs (it checks the pull request head's own run), so spawning a
    # full macOS matrix for a docs page only starves the self-hosted pool.
    paths-ignore:
      - 'README*'
      - 'CHANGELOG*'
      - '*.md'
      - 'docs/**'
      - 'assets/**'
  # The full matrix also runs nightly at 03:30 IST, staggered 30 minutes
  # from nightly.yml's integration recorders; a fresher main push in the
  # shared concurrency group supersedes it.
  schedule:
    - cron: "0 22 * * *"
  # PR CI is manual and trimmed: one Linux Ruby (3.4) over 4 shards, plus
  # lint, dco and the ignore audit; the full matrix - every Ruby, macOS, the
  # locale shards, the integration gems and dogfood - runs on pushes to main
  # and the nightly schedule only. A maintainer runs the PR profile against
  # the exact PR head with
  #   gh workflow run ci.yml --ref <head-branch> -f pr_number=<n> -f base_sha=<base-sha>
  # --ref must be a branch or tag name (the dispatch API rejects a raw SHA),
  # so exact-head binding comes from the API proof inside the run, not from
  # the ref: the ignore audit proves from the pull request that its head is
  # the checked-out SHA and its base is the base_sha input, and fails closed
  # otherwise. For a fork pull request the maintainer first pushes the
  # reviewed head into this repository, then dispatches on that branch:
  #   git push origin <reviewed-head-sha>:refs/heads/ci-pr-<n>
  #   gh workflow run ci.yml --ref ci-pr-<n> -f pr_number=<n> -f base_sha=<base-sha>
  # The proof still binds headRefOid to the fork's commit, so the branch can
  # only ever name the reviewed change.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number this run covers
        required: true
        type: string
      head_repo:
        # Unused since the macOS legs moved off pull request dispatches;
        # retained so existing dispatch commands that pass it keep working.
        description: Unused; kept for dispatch-command compatibility
        required: false
        type: string
      base_sha:
        description: The PR's exact base commit (the ignore audit and DCO check need it)
        required: true
        type: string

permissions:
  contents: read

# A newer dispatch for a pull request cancels that PR's superseded run, and a
# new push to main cancels the previous main run or an in-progress nightly
# (the push is the fresher full proof). PRs stay grouped per pull request
# (dispatches carry no pull_request payload, so the input names it).
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr_number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # Job names use stable OS labels, not runner labels, so swapping runners
    # never renames a check the panel gate waits on (see #347).
    name: Ruby ${{ matrix.ruby }} / linux / shard ${{ matrix.shard }}
    # 1 vCPU is enough: one rspec process is single-threaded.
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Pull request dispatches run one Linux Ruby (3.4) over the same 4
      # shards; pushes to main and the nightly schedule run the full matrix.
      # "4.0" pins the proving 4.0 line (today 4.0.7) so coverage does not
      # end when "ruby" floats to 4.1. Every leg is blocking: ci-passed
      # fails when any needed job fails, so a red 4.0 blocks a merge. The
      # shard total lives in the matrix so the script argument cannot drift
      # from the shard list. (No spaces after the JSON colons: a colon+space
      # would break the YAML plain scalar. The matrix itself is normal JSON.)
      matrix: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"ruby":["3.4"],"shard":[1,2,3,4],"total":[4]}') || fromJSON('{"ruby":["3.3","3.4","4.0","ruby"],"shard":[1,2,3,4],"total":[4]}') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Fail fast on an unfaithful toolchain before the suite spends
      # minutes (AGENTS.md, "Run discipline").
      - run: ruby bin/check-env
      # The extra json formatter only records per-example run times for the
      # shard weights (script/rspec-shard); the progress output and the
      # pass/fail verdict are unchanged. One Ruby per OS keeps the artifact
      # count down.
      - run: script/rspec-shard ${{ matrix.shard }} ${{ matrix.total }} --format progress --format json --out "$RUNNER_TEMP/rspec-times.json"
      - name: Keep the per-example run times
        if: always() && matrix.ruby == 'ruby'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rspec-times-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/rspec-times.json
          if-no-files-found: ignore

  # macOS legs run on GitHub-hosted macos-latest (arm64, free for public
  # repositories) on pushes to main and the nightly schedule only. Pull
  # request dispatches are the trimmed Linux profile, so no fork guard is
  # needed here anymore: the job never runs for a dispatch.
  test-macos:
    name: Ruby ${{ matrix.ruby }} / macos / shard ${{ matrix.shard }}
    runs-on: macos-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "ruby"] # "ruby" = latest stable
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Fail fast on an unfaithful toolchain before the suite spends
      # minutes (AGENTS.md, "Run discipline").
      - run: ruby bin/check-env
      - run: script/rspec-shard ${{ matrix.shard }} ${{ matrix.total }} --format progress --format json --out "$RUNNER_TEMP/rspec-times.json"
      - name: Keep the per-example run times
        if: always() && matrix.ruby == 'ruby'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rspec-times-macos-${{ matrix.shard }}
          path: ${{ runner.temp }}/rspec-times.json
          if-no-files-found: ignore
      - name: Clean up after a non-ephemeral runner
        if: always()
        run: |
          # The saboteur-mac runners are long-lived, so state this job wrote
          # inside the checkout would survive into the next unrelated job.
          # Remove it. The shared bundler cache, the toolcache and stray
          # processes stay untouched on purpose: the cache is a speed
          # trade-off for a separate decision, and a process pattern cannot
          # tell this runner instance's children from the sibling
          # instances' on the same machine.
          git clean -ffdx

  # Non-UTF-8 locale regression net: the whole suite under LANG=C, where
  # external bytes arrive US-ASCII-tagged and any unforced boundary raises.
  locale:
    name: Ruby 3.4 / LANG=C / shard ${{ matrix.shard }}
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch'
    env:
      LANG: C
      LC_ALL: C
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Fail fast on an unfaithful toolchain before the suite spends
      # minutes (AGENTS.md, "Run discipline").
      - run: ruby bin/check-env
      - run: script/rspec-shard ${{ matrix.shard }} ${{ matrix.total }}

  lint:
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop
      - name: SPDX headers
        run: |
          # Fixture projects model a host repo, so like rubocop they are exempt
          # from the SPDX header rule that the real sources follow.
          missing=$(grep -L "SPDX-License-Identifier: MIT" $(git ls-files -- '*.rb' '*.gemspec' 'exe/*' Gemfile Rakefile ':(exclude)spec/fixtures/projects/**' ':(exclude)acceptance/fixtures/**' ':(exclude)field-runs/apps/**' ':(exclude)field-runs/bugs/**' ':(exclude)field-runs/noise/**' ':(exclude)field-runs/runs/**' ':(exclude)field-runs/tool-verification/**' ':(exclude)field-runs/hosted/*/config.saboteur.rb') || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi

  integration-gems:
    name: ${{ matrix.target }} (${{ matrix.reeval }})
    # Namespace trial: slowest Linux job, moved to an nscloud AMD64 runner.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 15
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target: [dry-inflector, tty-color]
        reeval: [class_eval, nesting]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          # The repo commits no Gemfile.lock: the guard fails closed without
          # one, so the bundle must exist before the guard runs.
          bundler-cache: true
      # Fail fast on an unfaithful toolchain before the run spends minutes
      # (AGENTS.md, "Run discipline").
      - run: ruby bin/check-env
      - name: Run against the pinned commit and compare counts
        # --jobs 4 uses all 4 vCPUs of the runner; everything after `--`
        # is forwarded to saboteur by script/integration-target.
        run: script/integration-target "${{ matrix.target }}" "$RUNNER_TEMP/targets" --reeval "${{ matrix.reeval }}" --check -- --jobs 4

  # saboteur on its own changed methods. Survivors fail the check unless they
  # are on config/saboteur_ignore.rb with a reason. Runs on pushes to main
  # (diff = the pushed range) and on the nightly schedule (diff = the last
  # 24 hours of main commits); pull request dispatches run the trimmed
  # profile, so the dogfood gate moved here from the manual dispatch. The
  # map cache it maintains on main is what later dogfood runs restore.
  dogfood:
    if: github.event_name != 'workflow_dispatch'
    # The long pole of a main run at ~6 minutes: 4x8 halves it, and
    # --jobs 4 and --coverage-parts 4 match the 4 vCPUs (#741).
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Fail fast on an unfaithful toolchain before the run spends minutes
      # (AGENTS.md, "Run discipline").
      - run: ruby bin/check-env
      - name: Restore the coverage map
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .saboteur/coverage-*.json
            .saboteur/inputs-*.json
            .saboteur/whole-suite-map-v2
          key: saboteur-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'config/saboteur.rb', 'config/saboteur_custom_map.rb', 'config/saboteur_ignore.rb') }}-${{ github.sha }}
          restore-keys: |
            saboteur-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'config/saboteur.rb', 'config/saboteur_custom_map.rb', 'config/saboteur_ignore.rb') }}-
      # Where the diff starts: a push covers its own range; the nightly
      # covers the last 24 hours of main commits. The window slides with the
      # actual run start, so a queued nightly still covers the last day; a
      # skipped nightly leaves its window uncovered and the log names the
      # window - it is never silently green. Any other event fails closed.
      - name: Resolve the diff base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)
              [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] || { echo "push event without a usable before sha"; exit 1; }
              base="$BEFORE"
              ;;
            schedule)
              base=$(git rev-list -1 --before="24 hours ago" HEAD)
              [ -n "$base" ] || { echo "no main commit older than 24 hours"; exit 1; }
              ;;
            *)
              echo "dogfood has no diff base for event: $EVENT"
              exit 1
              ;;
          esac
          echo "dogfood diff base for $EVENT: $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # A config-only diff has nothing in the include scope to mutate: say so
      # and no-op green instead of dying on the out-of-scope stop (#483). A
      # version-only diff (a release: version.rb plus docs like CHANGELOG.md)
      # hits the same stop, because config/saboteur.rb excludes
      # lib/saboteur/version.rb from mutation (#1084). The pathspec mirrors
      # c.include in config/saboteur.rb - keep them in sync.
      - name: Detect config-only and version-only diffs
        id: scope
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- "lib/*.rb"; then
            echo "::notice::dogfood: no mutation measured - no changed file lies inside the include scope (config-only diff); green reports no mutation score"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$(git diff --name-only "$BASE_SHA" HEAD -- "lib/*.rb" | grep -vx 'lib/saboteur/version.rb')" ]; then
            echo "::notice::dogfood: no mutation measured - only lib/saboteur/version.rb changed and config/saboteur.rb excludes it; green reports no mutation score"
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi
      # Direct CLI run, not the action: the action is pull request shaped.
      # Survivors exit 1 and fail the job; the report always lands below.
      - name: Mutate the changed methods
        if: steps.scope.outputs.empty != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: bundle exec exe/saboteur run --since "$BASE_SHA" --json .saboteur/report.json --baseline-passes 1 --jobs 4 --coverage-parts 4
      # A run that fails on survivors still built a valid map, so the save
      # runs always, with the same key and paths the action uses.
      - name: Save the coverage map
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .saboteur/coverage-*.json
            .saboteur/inputs-*.json
            .saboteur/whole-suite-map-v2
          key: saboteur-${{ runner.os }}-${{ hashFiles('Gemfile.lock', 'config/saboteur.rb', 'config/saboteur_custom_map.rb', 'config/saboteur_ignore.rb') }}-${{ github.sha }}
      - name: Keep the report
        if: always() && steps.scope.outputs.empty != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saboteur-report
          # The per-part coverage build and baseline logs carry the failing
          # example when the suite breaks before any mutant runs (#801).
          path: |
            .saboteur/report.json
            .saboteur/*.log
          # upload-artifact skips hidden paths by default, and .saboteur is one.
          include-hidden-files: true


  # Ignore-hygiene audit (#703): a digest a pull request adds to
  # config/saboteur_ignore.rb must arise live on its head; a dropped
  # digest must be dead or killed by the suite. The de-ignore incident on
  # #571 slipped past scoped dogfood because the subject had not changed.
  ignore-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 25
    permissions:
      contents: read
      # The binding proof reads the pull request's head, base and head repo.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Fail closed unless the dispatch is the pull request's head and base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          REQUIRE_OWN_REPO: "0"
        run: script/ci-prove-pr-binding
      - name: Audit ignore-file digest churn
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        # Run the BASE ref's audit code against the head checkout: a pull
        # request must not edit the audit that judges it. A base predating
        # the script (it lands with this change) fails closed here.
        run: |
          git worktree add --detach "$RUNNER_TEMP/ignore-audit-base" "$BASE_SHA"
          bundle exec ruby "$RUNNER_TEMP/ignore-audit-base/script/ignore-audit" "$BASE_SHA"

  # The single required check for this workflow: it needs every other job and
  # fails when any of them failed or was cancelled. Branch protection and the
  # The DCO sign-off check lives here so ci-passed covers it: one required
  # check, no separate workflow verdict. Dispatches are pull request runs,
  # so the job checks base_sha..github.sha like the old dco.yml did; on main
  # pushes it skips (each commit was checked when its pull request merged)
  # and the aggregator allows exactly that skip.
  dco:
    if: github.event_name == 'workflow_dispatch'
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ inputs.base_sha }}
          HEAD: ${{ github.sha }}
        run: script/check-dco "$BASE" "$HEAD"

  # panel gate wait on this one name instead of a fixed job list, so adding
  # or renaming a job can never strand a merge; spec/ci_workflow_spec.rb
  # asserts the needs list always covers every job in this file.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [test, test-macos, locale, lint, integration-gems, dogfood, ignore-audit, dco]
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 5
    steps:
      - name: Fail when any needed job failed, was cancelled, or skipped unexpectedly
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const event = process.env.EVENT;
            // A job may skip only when its own `if` legitimately excludes
            // this event; any other skip fails closed, so a typo in a job
            // condition cannot silently drop a leg from the gate. The
            // trimmed lanes: heavy legs never run on pull request
            // dispatches, the PR-only audits never run anywhere else.
            const allowedSkip = {
              "test-macos": event === "workflow_dispatch",
              "locale": event === "workflow_dispatch",
              "integration-gems": event === "workflow_dispatch",
              "dogfood": event === "workflow_dispatch",
              "ignore-audit": event !== "workflow_dispatch",
              "dco": event !== "workflow_dispatch"
            };
            const bad = [];
            for (const [name, data] of Object.entries(needs)) {
              console.log(`${name}: ${data.result}`);
              if (["failure", "cancelled"].includes(data.result)) bad.push(`${name}: ${data.result}`);
              else if (data.result === "skipped" && !allowedSkip[name]) bad.push(`${name}: unexpected skip`);
            }
            if (bad.length) { console.error(`ci-passed: ${bad.join("; ")}`); process.exit(1); }
            console.log(`ci-passed: ${Object.keys(needs).length} needed jobs green or conditionally skipped`);
          '
