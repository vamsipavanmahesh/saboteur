name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.3", "3.4", "ruby"] # "ruby" = latest stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop
      - name: SPDX headers
        run: |
          missing=$(grep -L "SPDX-License-Identifier: MIT" $(git ls-files '*.rb' '*.gemspec' 'exe/*' Gemfile Rakefile) || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi

  # Placeholders, filled in later phases:
  #   integration-gems: two pinned public gems, every PR (Phase 2)
  #   dogfood: saboteur run --since origin/main on this repo (Phase 3)
