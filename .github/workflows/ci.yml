name: CI

on:
  push:
    branches: [main]
    # Docs-only merges skip the matrix: the panel gate never waits on main
    # push runs (it checks the pull request head's own run), so spawning a
    # full macOS matrix for a docs page only starves the self-hosted pool.
    paths-ignore:
      - 'README*'
      - 'CHANGELOG*'
      - '*.md'
      - 'docs/**'
      - 'assets/**'
  # PR CI is manual: nothing runs on pull_request events. A maintainer runs
  # the matrix against the exact PR head with
  #   gh workflow run ci.yml --ref <head-sha> -f pr_number=<n> -f head_repo=<owner/repo>
  # (head_repo comes from the PR's head.repository.full_name; it only skips
  # the macOS legs early - the legs themselves prove the head repo and SHA
  # from the API before running anything, so a wrong input fails closed).
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number this run covers
        required: true
        type: string
      head_repo:
        description: The PR head's owner/repo, for the macOS fork guard
        required: false
        type: string
      base_sha:
        description: The PR's exact base commit (dogfood diff mode needs it)
        required: true
        type: string

permissions:
  contents: read

# A newer dispatch for a pull request cancels that PR's superseded run, and a
# new push to main cancels the previous main run. PRs stay grouped per pull
# request (dispatches carry no pull_request payload, so the input names it).
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr_number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # Job names use stable OS labels, not runner labels, so swapping runners
    # never renames a check the panel gate waits on (see #347).
    name: Ruby ${{ matrix.ruby }} / linux / shard ${{ matrix.shard }}
    # 1 vCPU is enough: one rspec process is single-threaded.
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 15
    # Job level, not strategy level (#402 put it under strategy:, which is
    # invalid there): a red 4.0 leg cannot fail the run's conclusion while
    # the line proves itself; the gate's advisoryJobs does the verdict side.
    continue-on-error: ${{ matrix.ruby == '4.0' }}
    strategy:
      fail-fast: false
      matrix:
        # "4.0" pins the proving 4.0 line (today 4.0.7) so coverage does not
        # end when "ruby" floats to 4.1; the panel gate treats these legs as
        # advisory (policy.json advisoryJobs), so they never block a merge.
        ruby: ["3.3", "3.4", "4.0", "ruby"] # "ruby" = latest stable
        # The full suite runs as 3 round-robin file shards per Ruby leg so
        # each parallel job stays short instead of one long leg per version.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: script/rspec-shard ${{ matrix.shard }} 3

  # macOS legs run on the owner's self-hosted Mac (a pool of runner
  # instances labelled saboteur-mac on one machine, sized to the hardware).
  # Self-hosted runners never execute fork code: the legs run only for main
  # pushes and for dispatches whose head_repo input names this repository,
  # and the first step proves that input from the API - the pull request's
  # head repository must be this one and the dispatched SHA must be its
  # current head - so a wrong or forged head_repo fails closed before any
  # code is checked out. A fork pull request gets no macOS legs (the Linux
  # legs still cover it). Pull requests run the smallest useful matrix -
  # the latest stable Ruby only - while pushes to main still cover every
  # supported Ruby.
  test-macos:
    name: Ruby ${{ matrix.ruby }} / macos / shard ${{ matrix.shard }}
    runs-on: [self-hosted, saboteur-mac]
    timeout-minutes: 20
    permissions:
      contents: read
      # The fork guard reads the pull request's head repo and head SHA.
      pull-requests: read
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.head_repo == github.repository)
    strategy:
      fail-fast: false
      # (No spaces after the JSON colons: a colon+space would break the YAML
      # plain scalar. The matrix itself is normal JSON.)
      matrix: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"ruby":["ruby"],"shard":[1,2,3]}') || fromJSON('{"ruby":["3.3","3.4","ruby"],"shard":[1,2,3]}') }}
    steps:
      # The head_repo input is only a skip-early hint. Before anything is
      # checked out, prove from the API that this dispatch covers one of
      # this repository's own pull requests and that the dispatched SHA is
      # that pull request's current head; anything else fails closed.
      # GraphQL answers with one compact object, so exact greps are safe.
      - name: Fail closed unless the dispatch is the pull request's own head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in *[!0-9]*|'') echo "pr_number must be digits"; exit 1;; esac
          owner="${GITHUB_REPOSITORY%/*}"; name="${GITHUB_REPOSITORY#*/}"
          payload=$(printf '{"query":"{repository(owner:\"%s\",name:\"%s\"){pullRequest(number:%s){headRepository{nameWithOwner} headRefOid}}}"}' "$owner" "$name" "$PR_NUMBER")
          resp=$(curl -sfS -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d "$payload" https://api.github.com/graphql)
          echo "$resp" | grep -Fq "\"nameWithOwner\":\"$GITHUB_REPOSITORY\"" || { echo "PR #$PR_NUMBER is a fork or unknown head repo: no macOS legs"; exit 1; }
          echo "$resp" | grep -Fq "\"headRefOid\":\"$GITHUB_SHA\"" || { echo "dispatched SHA $GITHUB_SHA is not the current head of PR #$PR_NUMBER"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: script/rspec-shard ${{ matrix.shard }} 3
      - name: Clean up after a non-ephemeral runner
        if: always()
        run: |
          # The saboteur-mac runners are long-lived, so state this job wrote
          # inside the checkout would survive into the next unrelated job.
          # Remove it. The shared bundler cache, the toolcache and stray
          # processes stay untouched on purpose: the cache is a speed
          # trade-off for a separate decision, and a process pattern cannot
          # tell this runner instance's children from the sibling
          # instances' on the same machine.
          git clean -ffdx

  # Non-UTF-8 locale regression net: the whole suite under LANG=C, where
  # external bytes arrive US-ASCII-tagged and any unforced boundary raises.
  locale:
    name: Ruby 3.4 / LANG=C / shard ${{ matrix.shard }}
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 15
    env:
      LANG: C
      LC_ALL: C
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: script/rspec-shard ${{ matrix.shard }} 3

  lint:
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop
      - name: SPDX headers
        run: |
          # Fixture projects model a host repo, so like rubocop they are exempt
          # from the SPDX header rule that the real sources follow.
          missing=$(grep -L "SPDX-License-Identifier: MIT" $(git ls-files -- '*.rb' '*.gemspec' 'exe/*' Gemfile Rakefile ':(exclude)spec/fixtures/projects/**') || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi

  integration-gems:
    name: ${{ matrix.target }} (${{ matrix.reeval }})
    # Namespace trial: slowest Linux job, moved to an nscloud AMD64 runner.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [dry-inflector, tty-color]
        reeval: [class_eval, nesting]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
      - name: Run against the pinned commit and compare counts
        # --jobs 4 uses all 4 vCPUs of the runner; everything after `--`
        # is forwarded to saboteur by script/integration-target.
        run: script/integration-target "${{ matrix.target }}" "$RUNNER_TEMP/targets" --reeval "${{ matrix.reeval }}" --check -- --jobs 4

  # saboteur on its own changed methods. Survivors fail the check unless they
  # are on config/saboteur_ignore.rb with a reason.
  dogfood:
    # Mutates the methods a pull request changed, so it runs on the manual
    # dispatch (the pull_request trigger is gone) but not on main pushes.
    if: github.event_name == 'workflow_dispatch'
    # The long pole of a pull request run at ~6 minutes: 4x8 with --jobs 4
    # halves it. The dispatched job set takes 27 vCPU, inside the 32 vCPU
    # trial budget.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Mutate methods changed in this pull request
        uses: ./
        with:
          command: bundle exec exe/saboteur
          arguments: --baseline-passes 1 --jobs 4
          fail-on-survivors: "true"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saboteur-report
          path: .saboteur/report.json
