# SPDX-License-Identifier: MIT
#
# Throwaway diagnostic, dispatched by hand only (never part of ci.yml): the
# Landlock sandbox is unavailable on Namespace Linux runners and the probe
# failure mode varies by instance (a doctor spec failed on one). Sample the
# instance pool and print the raw facts. Delete this file once answered.
name: landlock-diagnostic

on:
  workflow_dispatch:

jobs:
  namespace:
    name: nscloud sample ${{ matrix.sample }}
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
      - name: Kernel and LSM state
        run: |
          uname -r
          cat /sys/kernel/security/lsm 2>&1 || echo "lsm file unreadable"
      - name: Raw landlock_create_ruleset probe
        run: |
          ruby -e '
            begin
              # x86_64 syscall 444: landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION)
              ret = syscall(444, 0, 0, 1)
              puts "return=#{ret} errno=0 (none)"
            rescue SystemCallError => e
              puts "return=-1 errno=#{e.errno} (#{e.class})"
            end
          '

  ubuntu-latest:
    name: ubuntu-latest contrast
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
      - name: Kernel and LSM state
        run: |
          uname -r
          cat /sys/kernel/security/lsm 2>&1 || echo "lsm file unreadable"
      - name: Raw landlock_create_ruleset probe
        run: |
          ruby -e '
            begin
              # x86_64 syscall 444: landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION)
              ret = syscall(444, 0, 0, 1)
              puts "return=#{ret} errno=0 (none)"
            rescue SystemCallError => e
              puts "return=-1 errno=#{e.errno} (#{e.class})"
            end
          '
