name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    # A signoff text check needs no compute; 1x2 keeps the pull request
    # set inside the 32 vCPU trial budget.
    runs-on: nscloud-ubuntu-24.04-amd64-1x2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: script/check-dco "$BASE" "$HEAD"
