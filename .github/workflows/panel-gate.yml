name: Panel head gate

on:
  push:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, DCO]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to revalidate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  statuses: write

# Group decisions per PR (per ref for pushes to main). A newer trigger for
# the same PR cancels its stale evaluation; different PRs decide in parallel
# instead of piling into one global serial queue that fills up and rejects
# runs (see Discussion #414).
concurrency:
  group: panel-head-gate-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.ref }}
  cancel-in-progress: true
  queue: max

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test trusted verifier
        run: node --test script/panel-gate/verify.test.cjs
      - name: Verify without checking out or executing PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/panel-gate/verify.cjs
