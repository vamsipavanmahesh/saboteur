name: Panel head gate

on:
  push:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, DCO]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to revalidate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  statuses: write

# Serialize all decisions, including comment revocations and workflow reruns.
concurrency:
  group: panel-head-gate
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    # Comments on anything but an open pull request cannot change a live
    # verdict: the verifier would fail closed on them (pulls/<n> 404s for a
    # plain issue, and a closed PR is refused), so do not spend a run -
    # or fill the queue - on them. Verdict and revocation comments live on
    # open pull requests, so gate semantics are unchanged.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.issue.state == 'open'))
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test trusted verifier
        run: node --test script/panel-gate/verify.test.cjs
      - name: Verify without checking out or executing PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/panel-gate/verify.cjs
