name: Panel head gate

on:
  push:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, DCO]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to revalidate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  statuses: write

# Group decisions per PR (per ref for pushes to main). A newer trigger for
# the same PR cancels its stale evaluation; different PRs decide in parallel
# instead of piling into one global serial queue that fills up and rejects
# runs (see Discussion #414). workflow_run events from fork pull requests
# carry no pull_requests entries (verify.cjs falls back to head_sha there
# too), so they key on the head SHA: same head, same lane.
concurrency:
  # A newer trigger cancels only within the same event family: cancellation
  # runs before the job-level if: filters an event out, so without the
  # suffixes any comment on the PR (any commenter), or a failed-CI
  # workflow_run on the same head, cancelled an in-progress verdict run and
  # left the head with no verdict (#628). Comment events get -comment,
  # non-success workflow_run completions get -inactive; verdict-affecting
  # events keep the shared per-PR/head lane.
  group: panel-head-gate-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || inputs.pr_number || github.ref }}${{ github.event_name == 'issue_comment' && '-comment' || '' }}${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && '-inactive' || '' }}
  cancel-in-progress: true

jobs:
  verify:
    # Comments on anything but an open pull request cannot change a live
    # verdict: the verifier would fail closed on them (pulls/<n> 404s for a
    # plain issue, and a closed PR is refused), so do not spend a run -
    # or fill the queue - on them. Verdict and revocation comments live on
    # open pull requests, so gate semantics are unchanged.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.issue.state == 'open')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test trusted verifier
        run: node --test script/panel-gate/verify.test.cjs
      - name: Verify without checking out or executing PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/panel-gate/verify.cjs
